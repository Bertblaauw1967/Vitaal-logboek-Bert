<style>
:root{
 --bg:#041525; --bg2:#07243d; --card:#0a2b4a; --card2:#0b3154;
 --line:#1e5078; --white:#f8fbff; --muted:#a8c3da; --pink:#ff5e8b;
 --blue:#4b8cff; --green:#65df7c; --teal:#39d6c5; --amber:#ffc13b;
 --purple:#a869ff; --red:#ff8796;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
body{min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:760px;margin:auto;min-height:100vh;padding:calc(22px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));background:
radial-gradient(circle at 88% 0%,#0d3b64 0,transparent 31%),linear-gradient(180deg,#061827 0%,#03111d 100%)}
.header{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-top:8px}
.brand h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,8.7vw,64px);line-height:.95;margin:8px 0 12px;letter-spacing:-2px}
.brand p{margin:0;color:#a9c5de;font-size:clamp(16px,3.5vw,22px);line-height:1.4}
.historyShortcut{width:128px;min-width:128px;border:1px solid #24537d;background:#08213a;color:#fff;border-radius:17px;padding:12px 8px;font-weight:700}
.historyShortcut b{display:block;color:var(--pink);font-size:27px;line-height:1;margin-bottom:5px}
.pulse{height:44px;position:relative;margin:20px 0 24px}
.pulse:before,.pulse:after{content:"";position:absolute;top:21px;height:3px;background:var(--pink);border-radius:5px}
.pulse:before{left:0;width:44%}.pulse:after{right:0;width:45%}
.pulse i{position:absolute;left:43%;top:7px;width:12%;height:28px;border-bottom:4px solid var(--pink);transform:skewX(-38deg)}
.page{display:none}.page.active{display:block}
.card{background:linear-gradient(180deg,rgba(12,48,82,.98),rgba(7,34,58,.98));border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 26px rgba(0,0,0,.16)}
.latest{padding:20px;margin-bottom:14px}
.latestHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.latestTitle{display:flex;align-items:center;gap:12px}.clock{width:42px;height:42px;border:2px solid #c7e0f4;border-radius:50%;display:grid;place-items:center;font-size:25px}
.latestTitle h2{font-size:23px;margin:0}.latestTitle small{display:block;color:#9fc3e2;margin-top:3px}
.newMeasure{border:1px solid var(--pink);background:transparent;color:var(--pink);border-radius:999px;padding:10px 13px;font-weight:800}
.latestGrid{display:grid;grid-template-columns:1fr 1fr 1fr}
.metric{padding:0 16px;border-left:1px solid #285575}.metric:first-child{border-left:0;padding-left:6px}
.label{color:#9db9d1;text-transform:uppercase;letter-spacing:.045em;font-size:13px;line-height:1.3}
.value{font-size:35px;font-weight:850;line-height:1.08;margin:8px 0 5px}.green{color:var(--green)}
.sub{color:#adc6da;font-size:14px;line-height:1.38}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:17px;min-height:150px;display:flex;gap:12px;align-items:center}
.icon{width:48px;height:48px;min-width:48px;border-radius:50%;display:grid;place-items:center;background:#0a2744;border:1px solid #2b67a3;font-size:22px;color:var(--blue)}
.icon.pink{color:var(--pink);border-color:#7a3552}.icon.teal{color:var(--teal);border-color:#2c766f}.icon.purple{color:var(--purple);border-color:#64499c}.icon.amber{color:var(--amber);border-color:#80691e}
.tile .value{font-size:30px}.badge{display:inline-block;margin-top:7px;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:800}.bad{background:#7a2a3c;color:#ffb1ba}.warn{background:#66521d;color:#ffdc80}.good{background:#184b3d;color:#8de7bd}
.message{margin-top:14px;padding:17px 19px;display:flex;gap:14px;align-items:center}.message strong{font-size:19px}.message p{margin:3px 0 0;color:#abc4d9}.message .info{font-size:28px;color:var(--blue)}
.sectionTitle{font-family:Georgia,"Times New Roman",serif;font-size:34px;margin:4px 0 16px}
.panel{padding:20px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.back{border:0;background:transparent;color:#9fc6ec;font-weight:700;padding:5px 0}
.summaryRow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.summary{padding:16px}.summary .value{font-size:30px}
.chart{height:210px;position:relative;margin-top:12px;background:linear-gradient(180deg,#08233c,#061b2f);border:1px solid #214a69;border-radius:18px;overflow:hidden}
.chart svg{width:100%;height:100%}.chartEmpty{height:100%;display:grid;place-items:center;color:#86a8c4;text-align:center;padding:20px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
form label,.settings label{display:block;color:#9eb9d0;font-size:12px;letter-spacing:.05em;margin:0 0 6px}
input{width:100%;background:#061d31;color:#fff;border:1px solid #2c5574;border-radius:14px;padding:14px 15px;font-size:18px;outline:none}
input:focus{border-color:var(--blue)}
.primary{width:100%;border:0;background:linear-gradient(135deg,#2c6fdd,#4b8cff);color:#fff;border-radius:15px;padding:15px;font-weight:800}
.settings{display:grid;gap:14px}.setting{padding:17px}.settingRow{display:grid;grid-template-columns:1fr auto;gap:10px}.settingRow .primary{width:auto;padding:0 16px}
.historyList{display:grid;gap:10px}.historyItem{padding:15px}.historyTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.historyDate{font-weight:800}.delete{border:0;background:transparent;color:#ff9cac}
.historyData{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.hmini{background:#08243e;border-radius:11px;padding:9px}.hmini span{display:block;color:#8faec7;font-size:10px}.hmini b{display:block;margin-top:3px;font-size:14px}
.empty{padding:35px;text-align:center;color:#91afc8}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.secondary{border:0;border-radius:14px;padding:13px;background:#214d6e;color:#fff;font-weight:700}

.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(3,17,29,.96);border-top:1px solid #1a4768;padding:8px 10px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(16px);z-index:20}
.bottomInner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav{border:0;background:transparent;color:#b4cadb;padding:5px 0;font-size:9.5px}.nav span{display:block;font-size:21px;margin-bottom:3px}.nav.active{color:var(--blue);font-weight:800}

@media(max-width:560px){
 .app{padding-left:11px;padding-right:11px}.historyShortcut{width:102px;min-width:102px;font-size:11px;padding:10px 6px}

<script>
(async function forceFreshVersion16(){
  const FLAG='leefkracht-force-refresh-v16';
  try{
    if(!sessionStorage.getItem(FLAG)){
      sessionStorage.setItem(FLAG,'1');
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
      }
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k)));
      }
    }
  }catch(e){}
})();
</script>

<main class="app">

  >
