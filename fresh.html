<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>Mijn LeefRitme 38.3 vernieuwen</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#06182a;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
.card{background:#0d2740;padding:28px;border-radius:22px;text-align:center}
strong{color:#ff4f8b}
</style>
<style>body{background:#08110d!important;color:#f4f1e7!important}.card{background:linear-gradient(180deg,#141d16,#0e1510)!important;border-color:rgba(154,174,114,.34)!important}p,.meta{color:#b5bdab!important}a{color:#b4c887!important}button{background:linear-gradient(135deg,#9aae72,#687a4f)!important;color:#08110d!important;border-color:rgba(230,236,213,.14)!important}</style></head>
<body>
<div class="card">
<h2>Mijn LeefRitme</h2>
<p>Overstappen naar het nieuwe updatesysteem: <strong>38.3</strong>…</p>
</div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  location.replace('./index.html?migrate=38.3&fresh='+Date.now());
})();
</script>
</body>
</html>
