<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeefKracht vernieuwen</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#06182a;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
.card{max-width:420px;margin:24px;padding:28px;border-radius:22px;background:#0d2740;text-align:center}
strong{color:#ff4f8b}
</style>
</head>
<body>
<div class="card"><h2>LeefKracht</h2><p>Cache wordt vernieuwd naar <strong>versie 29.1</strong>…</p></div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  location.replace('./index.html?v=29.1&fresh='+Date.now());
})();
</script>
</body>
</html>
