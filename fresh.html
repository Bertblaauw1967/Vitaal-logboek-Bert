<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeefKracht vernieuwen</title>
<body style="font-family:-apple-system,sans-serif;background:#061827;color:white;padding:32px">
<h1>LeefKracht vernieuwen</h1>
<p>De oude cache wordt verwijderd. Daarna opent de nieuwste versie automatisch.</p>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  location.replace('./index.html?v=21&fresh='+Date.now());
})();
</script>
</body>
