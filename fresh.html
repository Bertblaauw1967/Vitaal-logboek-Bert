<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeefKracht vernieuwen</title><style>body{font-family:-apple-system,sans-serif;background:#06182a;color:white;display:grid;place-items:center;min-height:100vh}.c{padding:28px;background:#0d2740;border-radius:22px;text-align:center}strong{color:#ff4f8b}</style></head><body><div class="c"><h2>LeefKracht</h2><p>Vernieuwen naar <strong>30.0</strong>…</p></div><script>(async()=>{try{if('serviceWorker'in navigator){let r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if('caches'in window){let k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}}catch(e){}location.replace('./index.html?v=30.0&fresh='+Date.now())})()</script></body></html>
