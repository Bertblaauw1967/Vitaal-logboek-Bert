<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>LeefKracht 31.5 vernieuwen</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#06182a;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}
.card{background:#0d2740;padding:28px;border-radius:22px;text-align:center}
strong{color:#ff4f8b}
</style>
</head>
<body>
<div class="card">
<h2>LeefKracht</h2>
<p>Overstappen naar het nieuwe updatesysteem: <strong>31.5</strong>…</p>
</div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  location.replace('./index.html?migrate=31.5&fresh='+Date.now());
})();
</script>
</body>
</html>
